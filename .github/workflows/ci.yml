name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Least privilege: no job needs to write to the repository.
permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.lock

      - name: Install pinned dev tools
        run: pip install -r requirements-dev.txt -c requirements.lock

      - name: Lint
        run: ruff check mcp-server/ tests/ scripts/

      - name: Format check
        run: ruff format --check mcp-server/ tests/ scripts/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements.lock

      - name: Install pinned dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt -c requirements.lock

      - name: Type-check
        run: |
          cd mcp-server
          mypy server.py tools/ --ignore-missing-imports
          mypy --strict tools/result_types.py --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # The spaCy model wheels are pip downloads, so this cache holds them too.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-models.txt
            requirements.lock

      - name: Cache sentence-transformer model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-paraphrase-multilingual-MiniLM-L12-v2-e8f8c211226b894fcb81acc59f3b34ba3efd5f42

      - name: Install pinned dependencies and spaCy models
        run: >-
          pip install -r requirements.txt -r requirements-dev.txt
          -r requirements-models.txt -c requirements.lock

      - name: Run tests with coverage gate
        run: >-
          pytest tests/ -q --cov=mcp-server --cov=scripts
          --cov-report=term-missing --cov-fail-under=80

      - name: AEGIS findings integrity
        run: python scripts/audit_status.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.lock

      - name: Install pip-audit
        run: pip install -r requirements-dev.txt -c requirements.lock

      # requirements.lock pins every transitive package, so it is audited as-is.
      # PYSEC-2026-3740 (nltk, no fixed release) is in TransitionParser model
      # loading, which this project never calls; nltk is only a transitive
      # dependency of textstat and lexicalrichness.
      - name: Audit pinned dependencies
        run: >-
          pip-audit -r requirements.lock --no-deps --disable-pip
          --ignore-vuln PYSEC-2026-3740

  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The gitleaks binary is pinned by version and SHA-256. gitleaks-action is
      # not used because it requires a paid licence key for organisation repos.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan history for secrets
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
